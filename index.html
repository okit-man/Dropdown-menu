<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sub Navbar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-center">
            <div class="nav-sidebar">
                <img src="./image/stripe-project/logo.svg" alt="nav-logo" class="nav-logo">
                <button class="btn toggle-btn">
                    <i class="fas fa-bars"></i>
                      <!-- <i class="fa fa-bars" aria-hidden="true"></i> -->
                </button>
            </div>
           <ul class="nav-links">
            <li>
                <button class="link-btn">product</button>
            </li>
             <li>
                <button class="link-btn">developer</button>
            </li>
             <li>
                <button class="link-btn">company</button>
            </li>
           </ul>
           <button class="btn signin-btn">sign in</button>
        </div>
    </nav>
    <section class="hero">
        <div class="hero-center">
            <article class="hero-info">
                <h1>Payment infrastructure <br />for the internet</h1>
                <p>Financial infrastructure to grow your revenue. Accept payments, offer financial services, and implement custom revenue models—from your first transaction to your billionth.</p>
                <button class="btns">start now</button>
            </article>
            <article class="hero-image">
                <img src="./image/stripe-project/phone.svg" class="phone-image" alt="phone-image">
            </article>
        </div>
    </section>
</body>
</html>
